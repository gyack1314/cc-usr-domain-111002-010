[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-packager"
version = "0.1.0"
description = "审查证据资料精确打包（Playwright 驱动本地合成门户）"
requires-python = ">=3.11"
dependencies = ["playwright==1.56.0"]

[tool.setuptools]
packages = ["packager"]

[tool.setuptools.package-dir]
packager = "packager"
